name: Bug report
description: Something does not work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: latex
    attributes:
      label: The equation's LaTeX
      description: Copy it from the LaTeX bar under the equation, if the bug is about an equation.
  - type: input
    id: version
    attributes:
      label: MathGen version
      description: Help → About MathGen
      placeholder: "1.0.0.42"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Other program involved
      description: For copy and paste problems, e.g. "Word 365", "Google Docs in Chrome".
