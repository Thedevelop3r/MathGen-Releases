name: Translation
description: Correct a translation or offer a new language
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Urdu
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Corrections or offer
      description: The text as it is now, and what it should be. To translate MathGen into a new language, say so here and you will get the English text file to translate.
    validations:
      required: true
